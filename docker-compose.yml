version: "3.9"

services:
  silicon-agents:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      SA_DB_PATH: /data/silicon_agents.db
    volumes:
      - silicon_agents_data:/data
    restart: unless-stopped

volumes:
  silicon_agents_data:
