<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silicon Agents · Pilot Access</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #dfe1e6;
      --text: #10233e;
      --muted: #53657f;
      --accent: #155eef;
      --accent-2: #0f7a73;
      --error: #ae2a19;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(21, 94, 239, 0.14), transparent 32%),
        radial-gradient(circle at top right, rgba(15, 122, 115, 0.12), transparent 26%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
    }
    .card {
      width: min(520px, 100%);
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 24px 60px rgba(14, 30, 54, 0.12);
    }
    .eyebrow {
      color: var(--accent-2);
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 0.96;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.65;
    }
    input,
    button {
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--line);
      padding: 14px 16px;
      font: inherit;
    }
    input {
      margin-bottom: 12px;
      background: #ffffff;
      color: var(--text);
    }
    button {
      border: none;
      cursor: pointer;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 16px 28px rgba(21, 94, 239, 0.18);
    }
    .hint {
      margin-top: 14px;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .error {
      margin-top: 12px;
      min-height: 1.2rem;
      color: var(--error);
      font-size: 0.92rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Pilot access</div>
    <h1>Protected preview</h1>
    <p>
      This pilot build is protected for controlled sharing. Enter the pilot access token to unlock the application in this browser.
    </p>
    <input id="pilotToken" type="password" placeholder="Enter pilot access token" autocomplete="off" />
    <button id="unlockBtn" type="button">Unlock Silicon Agents</button>
    <div class="error" id="errorMsg"></div>
    <div class="hint">
      After successful verification, this browser session will be allowed to access the product without adding the header on every page visit.
    </div>
  </div>

  <script>
    const apiBase = (() => {
      const stored = "https://silicon-agents-mvp-production.up.railway.app";
      if (window.location.protocol === "file:") {
        return "http://127.0.0.1:8000";
      }
      return stored;
    })();
    const nextPath = new URLSearchParams(window.location.search).get("next") || "/";
    const tokenEl = document.getElementById("pilotToken");
    const buttonEl = document.getElementById("unlockBtn");
    const errorEl = document.getElementById("errorMsg");

    async function unlock() {
      errorEl.textContent = "";
      buttonEl.disabled = true;
      try {
        const response = await fetch(`${apiBase}/pilot/unlock`, {
          method: "POST",
          headers: {
            "X-Pilot-Access-Token": tokenEl.value
          },
          credentials: "include"
        });
        if (!response.ok) {
          throw new Error("Invalid access token.");
        }
        window.location.href = nextPath;
      } catch (error) {
        errorEl.textContent = error.message || "Unable to unlock pilot access.";
      } finally {
        buttonEl.disabled = false;
      }
    }

    buttonEl.addEventListener("click", unlock);
    tokenEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        unlock();
      }
    });
  </script>
</body>
</html>
