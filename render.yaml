services:
  - type: web
    name: silicon-agents-mvp
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: SA_LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: PILOT_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
